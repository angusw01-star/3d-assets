<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>寶物：寶劍</title>
  <!-- 遊戲寶物取得範例。點寶劍 → 收進背包。
       模型網址可用 ?src= 換掉；上線時改成 jsDelivr 網址：
       https://cdn.jsdelivr.net/gh/angusw01-star/3d-assets@<版本>/models/optimized/treasure-sword.glb -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1440; color: #fff;
      font-family: system-ui, "Microsoft JhengHei", "PingFang TC", sans-serif; user-select: none; }
    canvas { display: block; touch-action: none; }
    #tip { position: absolute; top: 18px; width: 100%; text-align: center; font-size: 20px; text-shadow: 0 2px 6px #000a; }
    #banner { position: absolute; top: 40%; width: 100%; text-align: center; pointer-events: none;
      opacity: 0; transform: scale(0.6); transition: opacity .4s, transform .4s cubic-bezier(.2,1.6,.4,1); }
    #banner.show { opacity: 1; transform: scale(1); }
    #banner b { display: inline-block; font-size: 34px; padding: 10px 28px; border-radius: 16px;
      background: linear-gradient(#ffd75a, #f0a020); color: #5a2a00; box-shadow: 0 6px 20px #0008; }
    #banner div { margin-top: 10px; font-size: 18px; color: #bff; text-shadow: 0 2px 4px #000; }
    #bag { position: absolute; right: 16px; bottom: 16px; display: flex; gap: 8px; }
    .slot { width: 56px; height: 56px; border-radius: 10px; background: #0006; border: 2px solid #fff4;
      display: grid; place-items: center; font-size: 30px; }
    .slot.got { border-color: #ffd75a; box-shadow: 0 0 12px #ffd75a; }
    #again { position: absolute; left: 16px; bottom: 16px; padding: 8px 16px; font-size: 16px; border: none;
      border-radius: 10px; background: #fff2; color: #fff; cursor: pointer; display: none; }
  </style>
</head>
<body>
  <div id="tip">點一下寶劍，把它收進背包！</div>
  <div id="banner"><b>獲得寶劍！</b><div>攻擊力 +10</div></div>
  <div id="bag"><div class="slot" id="slot0"></div><div class="slot"></div><div class="slot"></div></div>
  <button id="again">再玩一次</button>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    const SRC = new URLSearchParams(location.search).get('src') || '../models/optimized/treasure-sword.glb';

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1b1440);
    scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
    const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 50);
    camera.position.set(0, 0.25, 2.4);
    camera.lookAt(0, 0.1, 0);
    const key = new THREE.DirectionalLight(0xfff2d0, 2);
    key.position.set(1, 2, 2);
    scene.add(key);

    // 底座光圈
    const ring = new THREE.Mesh(new THREE.RingGeometry(0.28, 0.36, 48),
      new THREE.MeshBasicMaterial({ color: 0xffd75a, transparent: true, opacity: 0.7, side: THREE.DoubleSide }));
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = -0.62;
    scene.add(ring);

    // 閃光粒子
    const N = 60, sparkPos = new Float32Array(N * 3), sparkSeed = Array.from({ length: N }, () => Math.random());
    const sparks = new THREE.Points(new THREE.BufferGeometry().setAttribute('position', new THREE.BufferAttribute(sparkPos, 3)),
      new THREE.PointsMaterial({ color: 0xfff3a0, size: 0.03, transparent: true, opacity: 0.9, depthWrite: false }));
    scene.add(sparks);

    // 寶劍
    const holder = new THREE.Group();
    scene.add(holder);
    let sword = null;
    new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).load(SRC, (gltf) => {
      sword = gltf.scene;
      holder.add(sword);
    }, undefined, (e) => { document.getElementById('tip').textContent = '模型載入失敗：' + SRC; console.error(e); });

    // 取得音效（WebAudio 合成，不需要音檔）
    function chime() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      [523, 659, 784, 1047].forEach((f, i) => {
        const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime + i * 0.09;
        o.type = 'triangle'; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
        o.connect(g).connect(ctx.destination);
        o.start(t); o.stop(t + 0.55);
      });
    }

    // 狀態：idle 漂浮 → collect 收集動畫 → done
    let state = 'idle', t0 = 0;
    const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
    renderer.domElement.addEventListener('pointerdown', (e) => {
      if (state !== 'idle' || !sword) return;
      ptr.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1);
      ray.setFromCamera(ptr, camera);
      // 寶劍很細，點中附近也算
      const hit = ray.intersectObject(holder, true).length || ray.ray.distanceToPoint(holder.position) < 0.5;
      if (!hit) return;
      state = 'collect'; t0 = performance.now();
      chime();
      document.getElementById('banner').classList.add('show');
      document.getElementById('tip').textContent = '';
    });
    document.getElementById('again').onclick = () => {
      state = 'idle';
      holder.scale.setScalar(1); holder.position.set(0, 0, 0); holder.visible = true;
      ring.visible = sparks.visible = true;
      document.getElementById('slot0').textContent = '';
      document.getElementById('slot0').classList.remove('got');
      document.getElementById('again').style.display = 'none';
      document.getElementById('tip').textContent = '點一下寶劍，把它收進背包！';
    };

    // 背包格子在 3D 空間中的位置（讓寶劍飛過去）
    function slotWorld() {
      const r = document.getElementById('slot0').getBoundingClientRect();
      const v = new THREE.Vector3((r.left + r.width / 2) / innerWidth * 2 - 1, -(r.top + r.height / 2) / innerHeight * 2 + 1, 0.5);
      v.unproject(camera);
      const dir = v.sub(camera.position).normalize();
      return camera.position.clone().add(dir.multiplyScalar(1.6));
    }

    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      const t = clock.getElapsedTime();
      ring.material.opacity = 0.45 + 0.3 * Math.sin(t * 3);
      for (let i = 0; i < N; i++) {
        const s = sparkSeed[i], k = (t * 0.25 + s) % 1, a = s * 40 + t * 0.6;
        sparkPos.set([Math.cos(a) * (0.25 + s * 0.2), -0.6 + k * 1.3, Math.sin(a) * (0.25 + s * 0.2)], i * 3);
      }
      sparks.geometry.attributes.position.needsUpdate = true;

      if (state === 'idle') {
        holder.rotation.y = t * 1.2;
        holder.position.y = Math.sin(t * 2) * 0.05;
      } else if (state === 'collect') {
        const p = (performance.now() - t0) / 1000;
        if (p < 0.8) {                       // 先往上升、快速旋轉
          holder.rotation.y += 0.35;
          holder.position.y = THREE.MathUtils.lerp(holder.position.y, 0.25, 0.1);
          holder.scale.setScalar(1 + 0.25 * Math.sin(p / 0.8 * Math.PI));
        } else if (p < 1.6) {                // 再飛進背包
          const k = (p - 0.8) / 0.8, target = slotWorld();
          holder.position.lerp(target, k * 0.25);
          holder.scale.setScalar(Math.max(0.05, 1 - k));
          holder.rotation.y += 0.2;
          ring.visible = sparks.visible = false;
        } else {
          state = 'done';
          holder.visible = false;
          document.getElementById('slot0').textContent = '🗡️';
          document.getElementById('slot0').classList.add('got');
          document.getElementById('again').style.display = 'block';
          setTimeout(() => document.getElementById('banner').classList.remove('show'), 1200);
        }
      }
      renderer.render(scene, camera);
    });

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
