<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D 模型展示</title>
  <!-- 用法：viewer.html?src=<GLB 網址>&title=<標題> -->
  <script>
    // 壓縮過（meshopt）的 GLB 需要解碼器
    self.ModelViewerElement = self.ModelViewerElement || {};
    self.ModelViewerElement.meshoptDecoderLocation = 'https://cdn.jsdelivr.net/npm/meshoptimizer@0.22.0/meshopt_decoder.js';
  </script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #f4f5f7; font-family: system-ui, "Microsoft JhengHei", sans-serif; }
    h1 { position: absolute; top: 12px; left: 16px; margin: 0; font-size: 18px; color: #333; z-index: 1; }
    model-viewer { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <h1 id="title"></h1>
  <model-viewer id="mv" camera-controls touch-action="pan-y" auto-rotate shadow-intensity="1" ar></model-viewer>
  <script>
    const params = new URLSearchParams(location.search);
    // 預設：Khronos 官方範例模型，示範用 jsDelivr 從 GitHub repo 載入 GLB
    document.getElementById('mv').src = params.get('src')
      || 'https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Assets@main/Models/Avocado/glTF-Binary/Avocado.glb';
    document.getElementById('title').textContent = params.get('title') || '';
  </script>
</body>
</html>
